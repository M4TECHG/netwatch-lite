name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests (unit, CLI, report structure, accessibility)
        run: pytest -q --junitxml=pytest.xml
      - name: "Demo must raise a High alert (exit code 2)"
        run: |
          set +e
          netwatch analyze samples/demo.pcap samples/demo_auth.log \
            --inventory samples/inventory.csv -c rules/default.yaml \
            --year 2026 --json report.json --csv report.csv --fail-on high
          code=$?
          set -e
          test "$code" -eq 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-py${{ matrix.python }}
          path: pytest.xml

  report-ui:
    name: Report UI regression
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - run: netwatch demo --out demo_output --lang en
      - name: Render at desktop + phone width, no console errors, no overflow
        run: python scripts/check_report.py demo_output/report.html
      - name: Screenshot light / dark / phone for visual review
        if: always()
        run: python scripts/check_report.py demo_output/report.html --shots _shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-report
          path: demo_output/report.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-screenshots
          path: _shots
